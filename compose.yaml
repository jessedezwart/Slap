services:
  bot:
    build: .
    image: slap
    restart: unless-stopped
    init: true
    env_file:
      - .env
    stop_signal: SIGINT
    stop_grace_period: 10s
    volumes:
      - cache:/app/data
      # Optional YouTube cookies; see README. Writable because yt-dlp saves
      # its cookie jar back.
      - secrets:/app/secrets
    configs:
      - source: ytdlp
        target: /etc/yt-dlp.conf
    depends_on:
      - pot-provider

  # PO token provider for yt-dlp's bgutil plugin. Only reachable on the compose
  # network; no ports are published. Keep the tag equal to BGUTIL_VERSION.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
    init: true

configs:
  # yt-dlp system config: point the plugin at the provider service.
  ytdlp:
    content: |
      --extractor-args youtubepot-bgutilhttp:base_url=http://pot-provider:4416

volumes:
  cache:
  secrets:
