<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slap</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Slap</h1>
      <span id="status" class="pill">starting</span>
    </header>

    <main>
      <p id="error" hidden></p>

      <section>
        <h2>Connected guilds <span id="count" class="muted"></span></h2>
        <table>
          <thead>
            <tr><th>Name</th><th class="num">Members</th><th>Voice</th></tr>
          </thead>
          <tbody id="guilds">
            <tr><td colspan="3" class="muted">Waiting for the gateway…</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
