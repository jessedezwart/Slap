[workspace]
resolver = "3"
members = ["crates/slap-core", "crates/slap-headless"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
slap-core = { path = "crates/slap-core" }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
incremental = false
debug-assertions = false
overflow-checks = false
